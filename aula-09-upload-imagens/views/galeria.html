{% extends 'base.html' %}
{% block content %}

<h2>Galeria</h2>

<div class="row">
    {% for img in imagem %}
    <div class="col-md-4">
        <div class="card mb-4 shadow-sm">
            <img src="/static/uploads/{{img.filename}}" class="img-thumnail">
        </div>
    </div>
    {% endfor %}
</div>

{%with messages = get_flashed_messages(with_categories=true) %}
      {%for category, message in messages %}
      <div class="alert alert-{{category}}"></div>
        {{ message }}
    </div>
    {%endfor%}
{%endwith%}

<div class="container col-6">
    <div class="card mt-4">
        <div class="card-body">
            <form action="{{ url_for('galeria') }}" method="post" enctype="multipart/form-data">

                <label for="file">Envie sua Imagem</label>
                <input type="file" name="file" class="form-control" required><br>
                <button type="submit" class="btn btn-danger btn-block">Enviar</button>
            </form>
        </div>
    </div>
</div>

{%endblock content %}
